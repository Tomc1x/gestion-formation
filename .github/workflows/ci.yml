name: CI
on:
  push:             # déclenché à chaque push
    branches: ['**']  # sur toutes les branches

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # machine virtuelle GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Test
        run: |
          chmod +x gradlew
          ./gradlew test
        working-directory: backend