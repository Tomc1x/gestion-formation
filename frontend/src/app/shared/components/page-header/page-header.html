<header class="topbar">
  <div class="search-box input-icon">
    <i data-lucide="search"></i>
    <input
      class="input"
      type="search"
      placeholder="Recherche globale…"
      [(ngModel)]="searchValue"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <div class="spacer"></div>

  <div class="role-switcher-wrap">
    <button
      type="button"
      class="ghost-btn role-switcher-btn"
      title="Changer de rôle (démo)"
      (click)="toggleSwitcher()">
      <i data-lucide="repeat"></i>
      <span>Démo : rôle</span>
      <i data-lucide="chevron-down"></i>
    </button>

    @if (switcher) {
      <div class="overlay" (click)="closeOverlays()"></div>
      <div class="card anim-in role-menu">
        <div class="menu-title">Prévisualiser en tant que</div>
        @for (r of roles; track r) {
          <button
            type="button"
            class="menu-item"
            [class.active]="r === role"
            (click)="onRoleSelect(r)">
            <app-ui-elements type="badge" [role]="r" size="sm"></app-ui-elements>
            <span class="menu-label">{{ getRoleLabel(r) }}</span>
            @if (r === role) {
              <i data-lucide="check" class="check-icon"></i>
            }
          </button>
        }
      </div>
    }
  </div>

  <button type="button" class="icon-btn notification-btn">
    <i data-lucide="bell"></i>
    @if (notifications > 0) {
      <span class="notif-dot"></span>
    }
  </button>

  <div class="separator"></div>

  <div class="user-wrap">
    <button type="button" class="user-btn" (click)="toggleMenu()">
      <app-ui-elements type="avatar" [name]="user.nom" [role]="role" [size]="36"></app-ui-elements>
      <div class="user-info">
        <div class="user-name">{{ user.nom }}</div>
        <div class="user-role">
          <app-ui-elements type="badge" [role]="role" size="sm"></app-ui-elements>
        </div>
      </div>
      <i data-lucide="chevron-down"></i>
    </button>

    @if (menu) {
      <div class="overlay" (click)="closeOverlays()"></div>
      <div class="card anim-in user-menu">
        <div class="user-card-head">
          <app-ui-elements type="avatar" [name]="user.nom" [role]="role" [size]="40"></app-ui-elements>
          <div class="user-meta">
            <div class="user-name-lg">{{ user.nom }}</div>
            <div class="user-email">{{ user.email }}</div>
          </div>
        </div>

        <div class="menu-actions">
          @for (action of ['Mon profil', 'Paramètres']; track action) {
            <button type="button" class="menu-link">
              <i data-lucide="user"></i>
              <span>{{ action }}</span>
            </button>
          }

          <div class="divider-line"></div>

          <button type="button" class="menu-link danger" (click)="onLogoutClick()">
            <i data-lucide="log-out"></i>
            <span>Se déconnecter</span>
          </button>
        </div>
      </div>
    }
  </div>
</header>
