<div *ngIf="open" class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" [style.width.px]="width" (click)="$event.stopPropagation()">

    <div *ngIf="title" class="modal-header">
      <div class="header-identity">
        <span *ngIf="icon" class="modal-icon">
          <i [attr.data-lucide]="icon"></i>
        </span>
        <div>
          <h2>{{ title }}</h2>
          <p *ngIf="subtitle" class="modal-subtitle">{{ subtitle }}</p>
        </div>
      </div>

      <button class="close-btn" (click)="onClose()" aria-label="Fermer">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

  </div>
</div>
